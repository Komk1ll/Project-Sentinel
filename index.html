<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#142020" />
    <title>Зареченск — Project Sentinel</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #142020; color: #e6edf3; font-family: 'Segoe UI', Arial, sans-serif; }
      #game-wrapper { position: relative; width: 100vw; height: 100vh; }
      #game-container, #three-container, #ui-container { position: absolute; inset: 0; }
      #three-container canvas { display: block; width: 100%; height: 100%; }
      #ui-container { pointer-events: none; z-index: 5; }
      #game-wrapper::after { content: ''; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 150px 30px #07101160; z-index: 2; }
      body { user-select: none; -webkit-user-select: none; }
    </style>
  </head>
  <body>
    <main id="game-wrapper" aria-label="Зареченск, Садовый квартал">
      <div id="game-container"></div>
      <div id="three-container"></div>
      <div id="ui-container"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
